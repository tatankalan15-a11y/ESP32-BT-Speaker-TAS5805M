[env]
framework = arduino
platform = espressif32 @ 6.11.0
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
build_flags = 
    -D SERIAL_BAUD=115200
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO

lib_deps = 
    pschatzmann/ESP32-A2DP @ 0.3.8
    https://github.com/sonocotta/esp32-tas5805m-dac

[env:esp32-bt-speaker-2ch]
board = esp32dev
build_flags =
    ${env.build_flags}
    -D CONFIG_DAC_TAS5805M
    -D SPEAKER_MODE=2
    -D PIN_I2C_SDA=21
    -D PIN_I2C_SCL=22
    -D PIN_I2S_FS=25
    -D PIN_I2S_SCK=26
    -D PIN_I2S_SD=14
    -D BT_SPEAKER_NAME="ESP32_BT_Speaker_2.0"

[env:esp32-bt-speaker-2ch-1]
board = esp32dev
build_flags =
    ${env.build_flags}
    -D CONFIG_DAC_TAS5805M
    -D SPEAKER_MODE=21
    -D PIN_I2C_SDA=21
    -D PIN_I2C_SCL=22
    -D PIN_I2S_FS=25
    -D PIN_I2S_SCK=26
    -D PIN_I2S_SD=14
    -D PIN_I2C_SDA_SUB=4
    -D PIN_I2C_SCL_SUB=5
    -D BT_SPEAKER_NAME="ESP32_BT_Speaker_2.1"
