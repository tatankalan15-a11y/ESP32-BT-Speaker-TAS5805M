[env]
framework = arduino
platform = espressif32 @ 6.11.0
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
build_flags = 
    -D SERIAL_BAUD=115200
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO

lib_deps = 
    pschatzmann/ESP32-A2DP @ 0.3.8
    https://github.com/sonocotta/esp32-tas5805m-dac

; ========================================================================
; ESP32 Bluetooth Speaker 2.0 - Production Ready
; 1x TAS5805M Stereo (L/R)
; ========================================================================
[env:esp32-bt-speaker-2ch]
board = esp32dev
build_flags =
    ${env.build_flags}
    -D CONFIG_DAC_TAS5805M
    -D CONFIG_TAS5805M_DSP_STEREO
    -D PIN_I2C_SDA=21
    -D PIN_I2C_SCL=22
    -D PIN_I2S_FS=25
    -D PIN_I2S_SCK=26
    -D PIN_I2S_SD=14
    -D BT_SPEAKER_NAME="ESP32_BT_Speaker"

; Variant: Stereo Loudness Level 1 (Enhanced Bass/Treble)
[env:esp32-bt-speaker-2ch-loudness1]
board = esp32dev
build_flags =
    ${env.build_flags}
    -D CONFIG_DAC_TAS5805M
    -D CONFIG_TAS5805M_DSP_STEREO_LOUDNESS_1
    -D PIN_I2C_SDA=21
    -D PIN_I2C_SCL=22
    -D PIN_I2S_FS=25
    -D PIN_I2S_SCK=26
    -D PIN_I2S_SD=14
    -D BT_SPEAKER_NAME="ESP32_BT_Speaker_L1"

; Variant: Stereo Loudness Level 2 (More Bass/Treble)
[env:esp32-bt-speaker-2ch-loudness2]
board = esp32dev
build_flags =
    ${env.build_flags}
    -D CONFIG_DAC_TAS5805M
    -D CONFIG_TAS5805M_DSP_STEREO_LOUDNESS_2
    -D PIN_I2C_SDA=21
    -D PIN_I2C_SCL=22
    -D PIN_I2S_FS=25
    -D PIN_I2S_SCK=26
    -D PIN_I2S_SD=14
    -D BT_SPEAKER_NAME="ESP32_BT_Speaker_L2"

; Variant: Stereo Loudness Level 3 (Maximum Bass/Treble)
[env:esp32-bt-speaker-2ch-loudness3]
board = esp32dev
build_flags =
    ${env.build_flags}
    -D CONFIG_DAC_TAS5805M
    -D CONFIG_TAS5805M_DSP_STEREO_LOUDNESS_3
    -D PIN_I2C_SDA=21
    -D PIN_I2C_SCL=22
    -D PIN_I2S_FS=25
    -D PIN_I2S_SCK=26
    -D PIN_I2S_SD=14
    -D BT_SPEAKER_NAME="ESP32_BT_Speaker_L3"
